<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
<div id="back">
<main class="card">
  <div class="main-side">
    <h3 id="res">Your Result</h3>
    <div class="percent">
      <h2>76</h2>
      <h3>of 100</h3>
    </div>
    <h2 class="main-text1">Great</h2>
    <p class="main-text2">You scored higher than 65% of the people who have taken these tests.</p>
  </div>
  <div class="summary-side">
    <h3>Summary</h3>
    <ul>
    <li class="rec"><img src="./assets/images/icon-reaction.svg" alt="Icon Reaction"><div class="text">Reaction</div><div class="percentage">80 / <span>100</span></div></li>

    <li class="mem"><img src="./assets/images/icon-memory.svg" alt="Icon Memory"><div class="text">Memory</div><div class="percentage">92 / <span>100</span></div></li>

    <li class="ver"><img src="./assets/images/icon-verbal.svg" alt="Icon Verbal"><div class="text">Verba</div><div class="percentage">61 / <span>100</span></div></li>

    <li class="vis"><img src="./assets/images/icon-visual.svg" alt="Icon Visual"><div class="text">Visual</div><div class="percentage">72 / <span>100</span></div></li>
    </ul>
    <button>Continue</button>
  </div>
</main>
</div>

</body>
</html>
